name: virtualhealth
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Intl para formatação de datas
  intl: ^0.18.1
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # Google Maps
  google_maps_flutter: ^2.5.0
  google_maps_flutter_android: ^2.19.8
  google_maps_flutter_platform_interface: ^2.4.0
  
  # Video Player
  video_player: ^2.8.1
  
  # Utilitários
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
    - assets/homepage.jpg
    - assets/video.mp4
    - assets/computadorhome.jpg