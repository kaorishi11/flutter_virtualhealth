name: virtualhealth
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Intl para formatação de datas
  intl: ^0.18.1
  table_calendar: ^3.0.9
  image_picker: ^1.0.4
  jitsi_meet_flutter_sdk: ^10.3.0
  # Supabase
  supabase_flutter: ^2.0.0
  
  # Mapas com Geoapify (alternativa ao Google Maps)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  http: ^1.1.0
  
  # Video Player
  video_player: ^2.8.1
  
  # Utilitários
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
    - assets/medico.png
    - assets/paciente.png
    - assets/mulhercomlogo.png
    - assets/homepage.jpg
    - assets/video.mp4
    - assets/computadorhome.jpg